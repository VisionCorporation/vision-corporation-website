@for (position of positions; track position) {
<div [class]="getPositionClasses(position)">
    @for (alert of getAlertsByPosition(position); track alert.id) {
    <div role="alert" [class]="getSlideClass(position)" [class.alert-enter]="alert.isVisible"
        [class.alert-exit]="!alert.isVisible" class="pointer-events-auto relative overflow-hidden flex items-start gap-3 w-11/12 max-w-sm sm:w-[380px]
           p-4 rounded-2xl border border-black/5 dark:border-white/10
           bg-white/90 dark:bg-neutral-900/90 backdrop-blur-xl
           shadow-[0_10px_40px_-12px_rgba(0,0,0,0.3)]">

        <div class="alert-icon shrink-0 grid place-items-center size-10 rounded-xl" [class]="getTheme(alert.type).icon">
            @switch (alert.type) {
            @case ('success') {
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path class="alert-draw" d="M5 13l4 4L19 7" />
            </svg>
            }
            @case ('error') {
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 8v5M12 16.5v.01" />
                <path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z" />
            </svg>
            }
            @case ('notification') {
            <svg class="size-5 alert-ring" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.7 21a2 2 0 01-3.4 0" />
            </svg>
            }
            }
        </div>

        <div class="flex-1 min-w-0 pt-0.5">
            <p class="text-sm font-semibold capitalize text-neutral-900 dark:text-white">{{ alert.type }}</p>
            <p class="mt-0.5 text-sm leading-snug text-neutral-600 dark:text-neutral-300 break-words">
                {{ alert.message }}
            </p>
        </div>

        <button (click)="fadeOutAlert(alert.id)" aria-label="Dismiss"
            class="shrink-0 -mr-1 -mt-1 p-1.5 rounded-lg text-neutral-400 transition
                   hover:bg-black/5 hover:text-neutral-700 dark:hover:bg-white/10 dark:hover:text-white cursor-pointer">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6L6 18M6 6l12 12" />
            </svg>
        </button>

        @if (alert.duration > 0) {
        <div class="absolute bottom-0 left-0 h-[3px] w-full origin-left alert-progress"
            [class]="getTheme(alert.type).bar" [style.animation-duration.ms]="alert.duration"></div>
        }
    </div>
    }
</div>
}
