<section class="bg-[var(--color-white)] px-4 py-16 sm:px-10 sm:py-20 lg:px-12 lg:py-24">
    <div class="relative mx-auto flex max-w-[1280px] flex-col items-center overflow-hidden rounded-3xl bg-[var(--color-primary)] px-6 py-16 text-center sm:px-12 sm:py-20 lg:rounded-[40px] lg:px-20 lg:py-24"
        data-aos="zoom-in-up" data-aos-duration="900" data-aos-once="true">

        <div aria-hidden="true"
            class="pointer-events-none absolute -right-24 -top-28 h-72 w-3/5 rounded-full bg-white/[0.08] blur-3xl transition-transform duration-1000 hover:scale-125"
            data-aos="fade-left" data-aos-delay="200" data-aos-duration="1000">
        </div>

        <div aria-hidden="true"
            class="pointer-events-none absolute -bottom-28 -left-24 h-72 w-3/5 rounded-full bg-white/[0.08] blur-3xl"
            data-aos="fade-right" data-aos-delay="300" data-aos-duration="1000">
        </div>

        <div class="relative z-10 flex max-w-3xl flex-col items-center">
            <h2 class="mt-6 font-heading text-3xl font-bold leading-tight tracking-tight text-white sm:text-4xl lg:text-5xl"
                data-aos="fade-up" data-aos-delay="200" data-aos-duration="800">
                {{ heading() }}
            </h2>

            @if (text()) {
            <p class="mt-5 max-w-2xl text-base leading-7 text-white/80 sm:text-lg sm:leading-8" data-aos="fade-up"
                data-aos-delay="350" data-aos-duration="800">
                {{ text() }}
            </p>
            }

            <div class="mt-9 flex w-full flex-col items-center justify-center gap-3 sm:w-auto sm:flex-row sm:gap-4"
                data-aos="fade-up" data-aos-delay="500" data-aos-duration="800">

                <a [routerLink]="primaryLink()"
                    class="group relative inline-flex min-h-12 w-full items-center justify-center gap-2 overflow-hidden rounded-full bg-white px-7 py-3.5 text-[15px] font-semibold text-[var(--color-primary)] transition-all duration-300 ease-out hover:-translate-y-1 hover:shadow-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--color-primary)] active:translate-y-0 active:scale-[0.98] motion-reduce:transition-none sm:w-auto">

                    <span aria-hidden="true"
                        class="absolute inset-0 origin-left scale-x-0 bg-[var(--color-primary-light)] transition-transform duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] group-hover:scale-x-100 group-focus-visible:scale-x-100 motion-reduce:transition-none"></span>

                    <span class="relative">{{ primaryLabel() }}</span>

                    <span class="relative h-4 w-4 overflow-hidden" aria-hidden="true">
                        <svg class="absolute inset-0 h-4 w-4 transition-transform duration-300 ease-out group-hover:translate-x-6 group-focus-visible:translate-x-6"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14M13 6l6 6-6 6" />
                        </svg>
                        <svg class="absolute inset-0 h-4 w-4 -translate-x-6 transition-transform duration-300 ease-out group-hover:translate-x-0 group-focus-visible:translate-x-0"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14M13 6l6 6-6 6" />
                        </svg>
                    </span>
                </a>

                @if (secondaryLabel()) {
                <a [routerLink]="secondaryLink()"
                    class="group relative inline-flex min-h-12 w-full items-center justify-center overflow-hidden rounded-full border border-white/30 bg-white/[0.06] px-7 py-3.5 text-center text-[15px] font-medium text-white transition-all duration-300 ease-out hover:-translate-y-1 hover:border-white/60 focus:outline-none focus-visible:border-white/60 focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--color-primary)] active:translate-y-0 active:scale-[0.98] motion-reduce:transition-none sm:w-auto">

                    <span aria-hidden="true"
                        class="absolute inset-0 origin-left scale-x-0 bg-white/15 transition-transform duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] group-hover:scale-x-100 group-focus-visible:scale-x-100 motion-reduce:transition-none"></span>

                    <span class="relative">{{ secondaryLabel() }}</span>
                </a>
                }
            </div>
        </div>
    </div>
</section>
