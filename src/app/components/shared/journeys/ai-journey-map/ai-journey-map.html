<section id="what-we-do" class="scroll-mt-24 bg-[var(--color-light)]">
    <div class="mx-auto max-w-[1400px] px-4 py-24 md:px-8 sm:py-28 lg:px-14">
        <div class="max-w-4xl" data-aos="fade-up" data-aos-duration="800">
            <p class="mb-3 text-sm font-medium uppercase tracking-wider text-[var(--color-primary)]">
                Our work
            </p>

            <h2 class="mt-5 text-3xl font-semibold leading-tight sm:text-4xl lg:text-5xl">
                <app-accent-text [parts]="data.heading" />
            </h2>

            <p class="mt-6 max-w-3xl text-lg leading-relaxed text-[var(--color-dark)]/70">
                {{ data.description }}
            </p>
        </div>

        <div class="mt-14 overflow-hidden rounded-3xl border border-black/10 bg-[var(--color-white)] shadow-xl shadow-black/5"
            data-aos="fade-up" data-aos-duration="800" data-aos-delay="100" data-aos-easing="ease-out-cubic">

            <div
                class="hidden grid-cols-[minmax(180px,0.7fr)_minmax(0,1.8fr)] gap-6 bg-[var(--color-dark)] px-6 py-4 text-xs font-medium uppercase tracking-wider text-[var(--color-primary-light)] sm:grid sm:px-8">
                <span>Journey</span>
                <span>What AI helps with</span>
            </div>

            @for (item of data.items; track item.journey; let i = $index) {
            <div class="group relative grid gap-2 border-b border-black/10 px-6 py-6 transition-colors duration-300 last:border-b-0 hover:bg-[var(--color-primary)]/5 sm:grid-cols-[minmax(180px,0.7fr)_minmax(0,1.8fr)] sm:items-center sm:gap-6 sm:px-8 sm:py-7 motion-reduce:transition-none"
                data-aos="fade-up" [attr.data-aos-delay]="i * 100" data-aos-duration="700">
                <span aria-hidden="true"
                    class="absolute inset-y-0 left-0 w-0.5 origin-top scale-y-0 bg-[var(--color-primary)] transition-transform duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] group-hover:scale-y-100 motion-reduce:transition-none"></span>

                <h3 class="flex items-center gap-4 text-lg font-semibold sm:text-xl">
                    <span
                        class="text-sm font-medium text-[var(--color-dark)]/30 transition-colors duration-300 group-hover:text-[var(--color-primary)]">
                        {{ (i + 1).toString().padStart(2, '0') }}
                    </span>
                    {{ item.journey }}
                </h3>

                <p class="leading-relaxed text-[var(--color-dark)]/70">
                    {{ item.description }}
                </p>
            </div>
            }
        </div>
    </div>
</section>
