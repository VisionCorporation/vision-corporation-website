<section class="bg-[var(--color-dark)] text-[var(--color-white)]">
    <div class="mx-auto max-w-[1400px] px-4 py-24 md:px-8 sm:py-28 lg:px-14">
        <div class="max-w-4xl" data-aos="fade-up" data-aos-duration="800">
            <p class="mb-3 text-sm font-medium uppercase tracking-wider text-[var(--color-primary-light)]">
                Our principles
            </p>

            <h2 class="mt-5 text-3xl font-semibold leading-tight sm:text-4xl lg:text-5xl">
                <app-accent-text [parts]="data.heading" />
            </h2>

            <p class="mt-6 max-w-xl text-lg leading-relaxed text-white/65">
                The principles that guide our decisions, our work and the partnerships we build.
            </p>
        </div>

        <ol class="relative mt-16 grid gap-10 md:grid-cols-3 md:gap-6">
            <span aria-hidden="true"
                class="absolute left-[16.6%] right-[16.6%] top-7 hidden border-t-2 border-dashed border-[var(--color-primary)]/30 md:block">
            </span>

            @for (item of data.items; track item.title; let i = $index) {
            <li class="group relative text-center" data-aos="fade-up" [attr.data-aos-delay]="i * 150"
                data-aos-duration="800" data-aos-easing="ease-out-cubic">
                <span
                    class="relative mx-auto flex h-14 w-14 items-center justify-center rounded-full border-2 border-[var(--color-primary)] bg-[var(--color-dark)] text-lg font-semibold text-[var(--color-primary)] transition-all duration-300 group-hover:scale-110 group-hover:bg-[var(--color-primary)] group-hover:text-[var(--color-white)] motion-reduce:transition-none">
                    {{ i + 1 }}
                </span>

                <div
                    class="mt-6 rounded-3xl border border-white/10 bg-white/5 p-8 transition-all duration-300 ease-out group-hover:-translate-y-1 group-hover:border-[var(--color-primary)]/40 group-hover:bg-white/[0.07] group-hover:shadow-xl motion-reduce:transition-none">
                    <span
                        class="mb-3 inline-block rounded-full bg-[var(--color-primary)]/15 px-3 py-1 text-xs font-medium uppercase tracking-wider text-[var(--color-primary-light)]">
                        Principle
                    </span>

                    <h3 class="mt-4 text-xl font-semibold">
                        {{ item.title }}
                    </h3>

                    <p class="mt-3 leading-relaxed text-white/65">
                        {{ item.description }}
                    </p>
                </div>
            </li>
            }
        </ol>
    </div>
</section>
