<section class="bg-[var(--color-dark)] text-[var(--color-white)]">
    <div class="mx-auto max-w-[1400px] px-4 py-24 md:px-8 sm:py-28 lg:px-14">
        <div class="grid gap-12 lg:grid-cols-12 lg:gap-16">
            <div class="lg:col-span-5" data-aos="fade-right" data-aos-duration="800">
                <div class="lg:sticky lg:top-32">
                    <p class="mb-3 text-sm font-medium uppercase tracking-wider text-[var(--color-primary-light)]">
                        The problem
                    </p>

                    <h2 class="mt-5 text-3xl font-semibold leading-tight sm:text-4xl lg:text-5xl">
                        <app-accent-text [parts]="data.heading" />
                    </h2>
                </div>
            </div>

            <div class="border-t border-white/10 lg:col-span-7" data-aos="fade-left" data-aos-duration="800"
                data-aos-delay="100">
                <div class="group relative border-b border-white/10">
                    <span aria-hidden="true"
                        class="absolute inset-x-0 -bottom-px h-px origin-left scale-x-0 bg-[var(--color-primary)] transition-transform duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] group-hover:scale-x-100 motion-reduce:transition-none">
                    </span>

                    <div
                        class="flex items-start gap-5 py-8 transition-transform duration-300 ease-out group-hover:translate-x-2 sm:gap-8 sm:py-10 motion-reduce:transition-none">
                        <span
                            class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full border border-white/10 text-[var(--color-primary)] transition-all duration-300 group-hover:border-[var(--color-primary)] group-hover:bg-[var(--color-primary)] group-hover:text-[var(--color-white)]">
                            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path
                                    d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" />
                                <path d="M12 9v4" />
                                <path d="M12 17h.01" />
                            </svg>
                        </span>

                        <p class="flex-1 text-lg leading-relaxed text-white/65 sm:text-xl">
                            {{ data.description }}
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
